[project]
name = "car-rental-system"
version = "1.0.0"
description = "Professional Car Rental System with Admin and User panels"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "psycopg2-binary>=2.9.9",
]

[tool.vercel]
entrypoint = "backend.main:app"
